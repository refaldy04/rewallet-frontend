<body>
<div class="shell">
<aside class="side"><a class="brand" href="#/dashboard"><span class="mark">r</span>rewallet<span style="color:#64923c">.</span></a><div><p class="side-label">DOMPET SAYA</p><nav class="nav" aria-label="Navigasi utama" id="desktop-nav"></nav></div><div class="side-bottom"><div class="side-note">Dompet, lebih teratur.<br><strong>Ruang untuk hal yang berarti.</strong></div></div></aside>
<div class="workspace"><header class="topbar"><a class="brand-mobile" href="#/dashboard">rewallet.</a><p class="crumb">Dompet saya <span style="margin:0 12px;color:#b0bcb0">/</span> <span id="crumb">Ringkasan</span></p><div class="account"><span class="preview">Prototipe · data contoh</span><a href="#/profile" class="account" aria-label="Buka profil"><span class="avatar">BA</span><span class="account-text"><span class="account-name">Bagas Anggana</span><br><small class="muted">Akun personal</small></span></a></div></header>
<main class="main" id="main"></main><nav class="mobile-nav" id="mobile-nav" aria-label="Navigasi utama mobile"></nav></div></div>
<script>
'use strict';
const navItems=[['dashboard','◫','Ringkasan'],['transfer','↗','Transfer'],['top-up','＋','Isi saldo'],['activity','↕','Aktivitas'],['profile','☷','Profil']];
const people=[{name:'Nadia Putri',initials:'NP',phone:'0812 •••• 2408'},{name:'Arif Rahman',initials:'AR',phone:'0857 •••• 9152'},{name:'Dinda Ayu',initials:'DA',phone:'0813 •••• 6007'},{name:'Fajar Pratama',initials:'FP',phone:'0821 •••• 3810'}];
const baseTransactions=[{name:'Nadia Putri',kind:'transfer',amount:150000,date:'Hari ini, 10.24',note:'Makan siang'},{name:'Isi saldo',kind:'topup',amount:1000000,date:'Hari ini, 08.10',note:'Isi saldo dompet'},{name:'Arif Rahman',kind:'transfer',amount:75000,date:'Kemarin, 19.42',note:'Kopi sore'},{name:'Dinda Ayu',kind:'transfer',amount:250000,date:'Kemarin, 12.08',note:'Patungan hadiah'}];
let balance=4250000,transactions=[...baseTransactions],selected=null,amount=150000,notes='',filter='all',hiddenBalance=false,receipt=null,pending=false,fullname='Bagas Anggana';
const money=n=>'Rp'+new Intl.NumberFormat('id-ID').format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label,cl='button')=>`<a href="#/${url}" class="${cl}">${label}</a>`;
function head(title,sub,eyebrow='DOMPET PERSONAL'){return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${sub}</p></div><span class="date">28 Oktober 2026</span></div>`}
function txRows(list){return list.length?list.map(t=>`<div class="transaction"><span class="avatar" aria-hidden="true">${t.kind==='topup'?'＋':'↗'}</span><div><p class="transaction-name">${esc(t.name)}</p><p class="transaction-meta">${esc(t.date)}</p></div><div class="transaction-value ${t.kind==='topup'?'positive':''}">${t.kind==='topup'?'+':'−'}${money(t.amount)}<br><span class="pill">Berhasil</span></div></div>`).join(''):'<p class="empty">Belum ada aktivitas di kategori ini.</p>'}
function personRow(p,i){return `<button class="receiver" data-person="${i}"><span class="avatar">${p.initials}</span><div><h3>${p.name}</h3><p>${p.phone}</p></div><span class="arrow">↗</span></button>`}
function steps(n){return `<ol class="steps" aria-label="Tahapan transfer">${['Penerima','Nominal','Konfirmasi'].map((s,i)=>`<li class="${i+1===n?'current':i+1<n?'done':''}" ${i+1===n?'aria-current="step"':''}><b>${i+1<n?'✓':i+1}</b>${s}</li>`).join('')}</ol>`}
function selectedCard(){return `<div class="receiver"><span class="avatar">${selected.initials}</span><div><h3>${selected.name}</h3><p>${selected.phone}</p></div>${link('transfer','Ubah','text-link arrow')}</div>`}
function dashboard(){return head('Halo, Bagas.','Kelola uangmu dengan lebih tenang, mulai dari sini.')+`<div class="dashboard-grid"><div class="stack"><section class="balance" aria-label="Saldo dompet"><div class="balance-head"><span class="balance-label">Saldo tersedia</span><button class="ghost-light" id="hide-balance" aria-pressed="${hiddenBalance}">${hiddenBalance?'Tampilkan':'Sembunyikan'}</button></div><p class="balance-value">${hiddenBalance?'Rp •••••••':money(balance)}</p><p class="balance-number">Rewallet personal · 0812 •••• 0404</p><div class="balance-actions">${link('transfer','↗ &nbsp; Transfer','button primary')}${link('top-up','＋ &nbsp; Isi saldo','button secondary')}</div></section><section class="panel"><div class="panel-head"><h2>Arus uang</h2><span class="small muted">7 hari · ilustrasi</span></div><div class="flow-summary"><div><span class="flow-label">↙ &nbsp; Uang masuk</span><strong>Rp2.120.000</strong></div><div><span class="flow-label">↗ &nbsp; Uang keluar</span><strong>Rp1.560.000</strong></div></div><div class="chart" role="img" aria-label="Ilustrasi arus uang Senin hingga Minggu, bukan data transaksi sebenarnya">${[[46,32],[73,44],[58,35],[95,65],[52,29],[78,48],[64,38]].map((b,i)=>`<div class="bar-group"><div class="bar" style="height:${b[0]}%"></div><div class="bar out" style="height:${b[1]}%"></div><span>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</span></div>`).join('')}</div><div class="legend"><span><b></b>Uang masuk</span><span><b class="out"></b>Uang keluar</span></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2>Kirim lagi</h2>${link('transfer','Lihat semua','text-link')}</div><div class="people">${people.map((p,i)=>`<button class="person" data-person="${i}"><span class="avatar">${p.initials}</span>${p.name.split(' ')[0]}</button>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Aktivitas terbaru</h2>${link('activity','Lihat semua','text-link')}</div>${txRows(transactions.slice(0,3))}</section><aside class="tip"><h3>Satu tempat, semua lebih jelas.</h3>Lihat setiap uang masuk dan keluar melalui menu Aktivitas.</aside></div></div>`}
function transferPage(){return head('Mau kirim ke siapa?','Cari penerima, lalu pilih kontak yang sesuai.','TRANSFER')+`<div class="narrow">${steps(1)}<section class="panel"><h2>Pilih penerima</h2><label class="field">Nama atau nomor telepon<input id="search" type="search" placeholder="Cari penerima…" autocomplete="off"></label><p class="small muted">Penerima Rewallet · data contoh</p><div id="receivers">${people.map(personRow).join('')}</div></section></div>`}
function amountPage(){return head('Tentukan nominal.','Saldo tersedia '+money(balance)+'.','TRANSFER')+`<div class="narrow">${steps(2)}<section class="panel">${selectedCard()}<form id="amount-form"><label class="field">Nominal transfer (Rp)<input class="money" id="amount" type="number" inputmode="numeric" min="10000" max="${Math.min(balance,5000000)}" step="1" value="${amount}" required></label><p class="note">Minimum Rp10.000 · maksimum Rp5.000.000</p><label class="field">Catatan <span class="muted">(opsional)</span><input id="notes" maxlength="100" placeholder="Untuk apa transfer ini?" value="${esc(notes)}"></label><p class="error" role="alert" id="amount-error"></p><div class="form-end">${link('transfer','← Pilih penerima lain','text-link')}<button class="button primary" type="submit">Periksa transfer &nbsp; →</button></div></form></section></div>`}
function confirmPage(){return head('Periksa sekali lagi.','Pastikan penerima dan nominal sudah sesuai.','TRANSFER')+`<div class="narrow">${steps(3)}<section class="panel">${selectedCard()}<div class="detail-row"><span>Nominal transfer</span><strong>${money(amount)}</strong></div><div class="detail-row"><span>Sisa saldo setelah transfer</span><strong>${money(balance-amount)}</strong></div><div class="detail-row"><span>Catatan</span><strong>${esc(notes||'—')}</strong></div><div class="notice">Simulasi desain. Tidak ada uang yang dikirim. Gunakan sembarang 6 digit untuk mencoba tampilan PIN.</div><form id="pin-form"><label class="field">PIN simulasi<input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="••••••" required aria-describedby="pin-help"></label><p class="note" id="pin-help">Jangan gunakan PIN asli.</p><div class="form-end">${link('transfer/amount','← Ubah nominal','text-link')}<button class="button primary" type="submit" id="send">Simulasikan transfer &nbsp; ↗</button></div></form></section></div>`}
function resultPage(){return head('Semua sudah beres.','Bukti simulasi transfermu ada di sini.','HASIL TRANSFER')+`<div class="narrow"><section class="panel"><div class="success-symbol" aria-hidden="true">✓</div><div class="center"><h2>Simulasi transfer berhasil</h2><p class="subtitle">${money(receipt.amount)} ke ${esc(receipt.name)}</p></div><div class="detail-row"><span>Nomor referensi contoh</span><strong>${receipt.id}</strong></div><div class="detail-row"><span>Waktu simulasi</span><strong>${receipt.date}</strong></div><div class="detail-row"><span>Catatan</span><strong>${esc(receipt.note||'—')}</strong></div><div class="notice">Ini bukti simulasi, bukan bukti pembayaran.</div><div class="form-end">${link('activity','Lihat aktivitas','text-link')}${link('dashboard','Kembali ke ringkasan','button primary')}</div></section></div>`}
function topupPage(){return head('Tambah ruang di dompetmu.','Pilih nominal isi saldo yang kamu butuhkan.','ISI SALDO')+`<div class="narrow"><section class="panel"><h2>Isi saldo Rewallet</h2><p class="subtitle">Saldo contoh saat ini <strong>${money(balance)}</strong></p><form id="topup-form"><label class="field">Nominal isi saldo (Rp)<input class="money" id="topup-amount" type="number" inputmode="numeric" min="10000" max="5000000" step="1" value="100000" required></label><div class="quick">${[50000,100000,250000,500000].map(n=>`<button class="filter" type="button" data-topup="${n}">${money(n)}</button>`).join('')}</div><div class="notice">Simulasi isi saldo mengikuti fitur nominal pada repo. Metode pembayaran dan virtual account perlu integrasi backend terpisah.</div><div class="form-end"><span class="note">Data hanya berubah selama pratinjau ini dibuka.</span><button class="button primary" type="submit" id="topup-send">Simulasikan isi saldo &nbsp; ＋</button></div><p id="topup-feedback" role="status" class="notice" hidden></p></form></section></div>`}
function activityPage(){return head('Setiap transaksi, tercatat.','Pantau uang masuk dan keluar di satu tempat.','AKTIVITAS')+`<section class="panel"><div class="panel-head"><h2>Riwayat transaksi</h2><span class="small muted">${transactions.length} transaksi contoh</span></div><div class="filters" aria-label="Filter aktivitas">${[['all','Semua'],['transfer','Transfer'],['topup','Isi saldo']].map(([v,l])=>`<button class="filter" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><div id="activity-list">${txRows(transactions.filter(t=>filter==='all'||t.kind===filter))}</div></section>`}
function profilePage(){return head('Ruang personalmu.','Atur informasi akun dan keamanan dompet.','PROFIL')+`<div class="profile-grid"><section class="panel identity"><span class="avatar">BA</span><div><h2>${esc(fullname)}</h2><p class="subtitle">@bagas</p><p class="small muted" style="margin-top:8px">Akun contoh</p></div></section><section class="panel"><h2>Pengaturan akun</h2>${[['profile/personal','Informasi personal','Nama, email, dan nomor telepon'],['profile/password','Ubah kata sandi','Perbarui akses masuk ke akunmu'],['profile/pin','Ubah PIN','Fitur pada repo masih dalam pengembangan']].map(([u,l,s])=>`<a class="settings-link" href="#/${u}"><span>${l}<small>${s}</small></span><span>→</span></a>`).join('')}<p class="note" style="margin-top:22px">Foto profil dan sesi masuk terhubung ke akun pada implementasi akhir. Pratinjau ini memakai data contoh.</p></section></div>`}
function personalPage(){return head('Informasi personal.','Kelola informasi yang ditampilkan di akunmu.','PROFIL')+`<div class="narrow"><section class="panel"><form id="personal-form"><label class="field">Nama lengkap<input id="fullname" value="${esc(fullname)}" maxlength="60" required></label><div class="detail-row"><span>Email contoh</span><strong>bagas@example.com</strong></div><div class="detail-row"><span>Nomor telepon contoh</span><strong>0812 •••• 0404</strong></div><div class="form-end">${link('profile','← Kembali ke profil','text-link')}<button type="submit" class="button primary">Simpan nama contoh</button></div></form></section></div>`}
function securityPage(pin){return head(pin?'Ubah PIN.':'Ubah kata sandi.',pin?'Rancangan fitur yang masih dikembangkan di repo.':'Rancangan form perubahan kata sandi.','KEAMANAN')+`<div class="narrow"><section class="panel"><form id="security-form">${(pin?['PIN saat ini','PIN baru','Ulangi PIN baru']:['Kata sandi saat ini','Kata sandi baru','Ulangi kata sandi baru']).map((l,i)=>`<label class="field">${l}<input type="password" ${pin?'inputmode="numeric" pattern="[0-9]{6}" maxlength="6"':'minlength="8"'} name="secret${i}" required autocomplete="off"></label>`).join('')}<div class="notice">Form ini hanya menunjukkan rancangan. Jangan masukkan kredensial asli.</div><p role="status" id="security-status" class="notice" hidden></p><div class="form-end">${link('profile','← Kembali ke profil','text-link')}<button class="button primary" type="submit">Coba validasi form</button></div></form></section></div>`}
function navigate(p){location.hash='/'+p}
function render(){if(pending)return;let route=(location.hash.slice(2)||'dashboard').split('?')[0];if((route==='transfer/amount'||route==='transfer/confirm')&&!selected){navigate('transfer');return}if(route==='transfer/result'&&!receipt){navigate('activity');return}const section=route.split('/')[0];for(const nav of ['desktop-nav','mobile-nav'])document.getElementById(nav).innerHTML=navItems.map(([u,i,l])=>`<a href="#/${u}" ${section===u?'aria-current="page"':''}><span class="icon" aria-hidden="true">${i}</span>${l}</a>`).join('');document.getElementById('crumb').textContent=navItems.find(n=>n[0]===section)?.[2]||'Halaman';const pages={'dashboard':dashboard,'transfer':transferPage,'transfer/amount':amountPage,'transfer/confirm':confirmPage,'transfer/result':resultPage,'top-up':topupPage,'activity':activityPage,'profile':profilePage,'profile/personal':personalPage,'profile/password':()=>securityPage(false),'profile/pin':()=>securityPage(true)};document.getElementById('main').innerHTML=`<div class="screen">${pages[route]?pages[route]():head('Halaman tidak ditemukan.','Kembali ke ringkasan untuk melanjutkan.')+link('dashboard','Buka ringkasan','button primary')}</div><footer class="foot"><span>© 2026 Rewallet · Dompet, lebih teratur.</span><span>Konsep desain · Tanpa koneksi ke layanan pembayaran</span></footer>`;document.title=(document.getElementById('crumb').textContent)+' — Rewallet';bind();}
function bind(){document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=people[Number(b.dataset.person)];navigate('transfer/amount')});const search=document.getElementById('search');if(search)search.oninput=()=>{const q=search.value.trim().toLowerCase();document.getElementById('receivers').innerHTML=people.map((p,i)=>({p,i})).filter(({p})=>(p.name+' '+p.phone).toLowerCase().includes(q)).map(({p,i})=>personRow(p,i)).join('')||'<p class="empty">Penerima tidak ditemukan. Coba nama lain.</p>';document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=people[Number(b.dataset.person)];navigate('transfer/amount')})};const hide=document.getElementById('hide-balance');if(hide)hide.onclick=()=>{hiddenBalance=!hiddenBalance;render()};const amountForm=document.getElementById('amount-form');if(amountForm)amountForm.onsubmit=e=>{e.preventDefault();const n=Number(document.getElementById('amount').value);if(!Number.isInteger(n)||n<10000||n>5000000||n>balance){document.getElementById('amount-error').textContent='Periksa nominal dan saldo yang tersedia.';return}amount=n;notes=document.getElementById('notes').value.trim();navigate('transfer/confirm')};const pinForm=document.getElementById('pin-form');if(pinForm)pinForm.onsubmit=e=>{e.preventDefault();if(pending)return;pending=true;const b=document.getElementById('send');b.disabled=true;b.textContent='Memproses simulasi…';setTimeout(()=>{balance-=amount;const date=new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'}).format(new Date());receipt={name:selected.name,amount,note:notes,date,id:'DEMO-'+Date.now().toString().slice(-8)};transactions.unshift({name:selected.name,kind:'transfer',amount,date,note:notes});pending=false;navigate('transfer/result');render()},750)};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-topup]').forEach(b=>b.onclick=()=>document.getElementById('topup-amount').value=b.dataset.topup);const tf=document.getElementById('topup-form');if(tf)tf.onsubmit=e=>{e.preventDefault();const n=Number(document.getElementById('topup-amount').value);if(!Number.isInteger(n)||n<10000||n>5000000)return;balance+=n;transactions.unshift({name:'Isi saldo',kind:'topup',amount:n,date:'Baru saja · simulasi',note:'Isi saldo contoh'});render();const f=document.getElementById('topup-feedback');f.hidden=false;f.textContent='Simulasi isi saldo '+money(n)+' berhasil. Saldo contoh sudah diperbarui.'};const pf=document.getElementById('personal-form');if(pf)pf.onsubmit=e=>{e.preventDefault();const n=document.getElementById('fullname').value.trim();if(!n)return;fullname=n;navigate('profile')};const sf=document.getElementById('security-form');if(sf)sf.onsubmit=e=>{e.preventDefault();const d=new FormData(sf),s=document.getElementById('security-status');s.hidden=false;s.textContent=d.get('secret1')===d.get('secret2')?'Validasi contoh berhasil. Tidak ada perubahan kredensial.':'Isian baru dan konfirmasi belum sama.';sf.reset()}}
window.addEventListener('hashchange',()=>{render();if(!pending)window.scrollTo(0,0)});render();
</script>
</body></html>
